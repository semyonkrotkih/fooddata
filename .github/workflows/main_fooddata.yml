# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - fooddata

on:
  push:
    branches:
      - 'main'
    # Only run when the API (or this workflow) changes — app/Expo changes don't trigger a deploy
    paths:
      - 'fooddata_api/**'
      - '.github/workflows/main_fooddata.yml'
  workflow_dispatch:

# Never run two deployments at once (overlapping OneDeploy calls also return 409)
concurrency:
  group: deploy-fooddata
  cancel-in-progress: false

env:
  APP_DIR: fooddata_api
  AZURE_WEBAPP_NAME: fooddata
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }} # optional; looked up automatically if unset
  # Gunicorn + Uvicorn worker serving the FastAPI instance `app` in fooddata_api/api.py.
  # Long timeout because spaCy / sentence-transformers models load at import time.
  STARTUP_COMMAND: gunicorn --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 600 --bind 0.0.0.0:8000 api:app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Local build check: catches dependency issues early. Oryx re-installs on Azure
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so the venv itself is not deployed.
      - name: Create virtual environment and install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Only the contents of fooddata_api/ are packaged, so requirements.txt and api.py
      # sit at the root of the deployed site (/home/site/wwwroot).
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ${{ env.APP_DIR }}/
            !${{ env.APP_DIR }}/antenv/
            !${{ env.APP_DIR }}/**/__pycache__/
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "5ea055e3-0d0c-4bc5-be41-591a3f162def"
          tenant-id: "10d205c2-2d4f-4105-9d31-7c83c352f32e"
          subscription-id: "e276d1fb-8d8d-4aae-9c2f-42dc21a81670"

      - name: Resolve resource group
        run: |
          if [ -z "$AZURE_RESOURCE_GROUP" ]; then
            AZURE_RESOURCE_GROUP=$(az webapp list --query "[?name=='$AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv)
          fi
          echo "AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "Using resource group: $AZURE_RESOURCE_GROUP"

      # OneDeploy returns 409 Conflict when another deployment is still running on Kudu
      # (e.g. a previous Oryx build) or when WEBSITE_RUN_FROM_PACKAGE is set.
      # Print the relevant state and wait for any in-progress deployment to finish.
      - name: Check for conflicting deployments
        run: |
          SITE_ID=$(az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" --query id -o tsv)
          echo "SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

          echo "--- Relevant app settings ---"
          az webapp config appsettings list -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE' || name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='ENABLE_ORYX_BUILD'].{name:name,value:value}" -o table

          echo "--- Recent deployments (status: 0 pending, 1 building, 2 deploying, 3 failed, 4 success) ---"
          az rest --method get --url "https://management.azure.com${SITE_ID}/deployments?api-version=2023-12-01" \
            --query "value[0:5].{id:name,status:properties.status,active:properties.active,start:properties.start_time,end:properties.end_time,msg:properties.message}" -o table || true

          for i in $(seq 1 30); do
            BUSY=$(az rest --method get --url "https://management.azure.com${SITE_ID}/deployments?api-version=2023-12-01" \
              --query "length(value[?properties.status==\`0\` || properties.status==\`1\` || properties.status==\`2\`])" -o tsv 2>/dev/null || echo 0)
            if [ "${BUSY:-0}" = "0" ]; then echo "No deployment in progress."; break; fi
            echo "Deployment in progress on Kudu ($BUSY), waiting... ($i/30)"
            [ "$i" = "30" ] && echo "::warning::A deployment is still in progress after 15 minutes; deploy will likely return 409."
            sleep 30
          done

          echo "--- Site / deployment source config ---"
          az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "{kind:kind,state:state,plan:appServicePlanId}" -o table
          az webapp config show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "{scmType:scmType,linuxFxVersion:linuxFxVersion}" -o table
          az resource show --ids "${SITE_ID}/basicPublishingCredentialsPolicies/scm" --query "{scmBasicAuth:properties.allow}" -o table || true

      # Zip the API and push it straight to Kudu's OneDeploy endpoint, printing Kudu's full
      # response body so any rejection (400/409) shows its actual reason in the log.
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        run: |
          cd app
          zip -qr ../app.zip .
          cd ..
          echo "--- Package contents ---"
          unzip -l app.zip

          echo "--- App setting names (values hidden) ---"
          az webapp config appsettings list -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" --query "[].name" -o tsv

          HOST=$(az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" --query defaultHostName -o tsv)
          SCM_HOST=$(az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" --query "hostNameSslStates[?hostType=='Repository'].name | [0]" -o tsv)
          echo "webapp-url=https://$HOST" >> "$GITHUB_OUTPUT"
          TOKEN=$(az account get-access-token --query accessToken -o tsv)

          echo "--- Kudu: latest deployment before this one ---"
          PREV=$(curl -s -H "Authorization: Bearer $TOKEN" "https://$SCM_HOST/api/deployments/latest" || echo '{}')
          echo "$PREV"
          PREV_ID=$(echo "$PREV" | jq -r '.id // empty' 2>/dev/null || true)

          # async=true: Oryx's pip install (torch, spaCy, ...) outlasts the ~230s gateway
          # timeout of a synchronous request (HTTP 504), so start it and poll the status instead.
          echo "--- Deploying to https://$SCM_HOST/api/publish?type=zip&async=true ---"
          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            "https://$SCM_HOST/api/publish?type=zip&async=true")
          echo "HTTP $STATUS"
          cat response.txt; echo
          case "$STATUS" in 2*) ;; *) exit 1 ;; esac

          # Poll until Kudu reports the deployment complete (status 4 = success, 3 = failed)
          for i in $(seq 1 120); do
            sleep 20
            # Refresh token occasionally; builds can run long
            [ $((i % 30)) = 0 ] && TOKEN=$(az account get-access-token --query accessToken -o tsv)
            DEP=$(curl -s -H "Authorization: Bearer $TOKEN" "https://$SCM_HOST/api/deployments/latest" || echo '{}')
            if [ "$(echo "$DEP" | jq -r '.id // empty')" = "$PREV_ID" ]; then
              echo "[$i] waiting for new deployment to register..."; continue
            fi
            DEP_STATUS=$(echo "$DEP" | jq -r '.status // empty')
            COMPLETE=$(echo "$DEP" | jq -r '.complete // false')
            echo "[$i] status=$DEP_STATUS complete=$COMPLETE $(echo "$DEP" | jq -r '.progress // .status_text // empty')"
            if [ "$COMPLETE" = "true" ]; then
              if [ "$DEP_STATUS" = "4" ]; then echo "Deployment succeeded."; exit 0; fi
              echo "::error::Deployment failed (status $DEP_STATUS). Build log:"
              DEP_ID=$(echo "$DEP" | jq -r '.id')
              for url in $(curl -s -H "Authorization: Bearer $TOKEN" "https://$SCM_HOST/api/deployments/$DEP_ID/log" | jq -r '.[].details_url // empty'); do
                curl -s -H "Authorization: Bearer $TOKEN" "$url" | jq -r '.[].message'
              done
              curl -s -H "Authorization: Bearer $TOKEN" "https://$SCM_HOST/api/deployments/$DEP_ID/log" | jq -r '.[].message'
              exit 1
            fi
          done
          echo "::error::Deployment did not complete within 40 minutes"
          exit 1

      # Give the container time to load the ML models on startup, and set the command
      # that starts the API. Applied after deploy, then the restart below picks it up.
      - name: Configure startup command and app settings
        run: |
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
            --output none
          az webapp config set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --startup-file "$STARTUP_COMMAND" \
            --output none

      - name: Restart web app
        run: az webapp restart --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP"

      # Wait until the API is up and Swagger UI responds
      - name: Verify API is running
        run: |
          URL="${{ steps.deploy-to-webapp.outputs.webapp-url }}"
          echo "Waiting for $URL/docs ..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/docs" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is up: $URL"
              echo "Swagger UI: $URL/docs"
              exit 0
            fi
            sleep 30
          done
          echo "API did not respond in time. Check logs: az webapp log tail -n $AZURE_WEBAPP_NAME -g $AZURE_RESOURCE_GROUP"
          exit 1
